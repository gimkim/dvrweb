<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11171c"><title>GimDVR · กล้องที่บ้าน</title><link rel="stylesheet" href="app.css"><script defer src="vendor/hls.min.js"></script><script defer src="live-controls.js"></script><script defer src="copy-stream.js"></script><script defer src="app.js"></script></head>
<body><div id="login" class="login-wrap" hidden><form id="loginForm" class="login-box"><div class="brand"><span class="brand-mark">◉</span> Gim<span>DVR</span></div><p class="eyebrow">HOME SURVEILLANCE</p><h1>กลับมาดูแลบ้าน</h1><p class="muted">เข้าสู่ระบบเพื่อดูภาพสดและวิดีโอย้อนหลัง</p><label>ชื่อผู้ใช้<input name="username" autocomplete="username" required></label><label>รหัสผ่าน<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">เข้าสู่ระบบ →</button><p id="loginError" class="error" role="alert"></p><small>บัญชีเริ่มต้นอยู่ใน bootstrap.txt บนเซิร์ฟเวอร์</small></form></div>
<div id="shell" hidden><aside><div class="brand"><span class="brand-mark">◉</span> Gim<span>DVR</span></div><div class="workspace-label">บ้านของเรา <span class="dot"></span></div><nav><button data-page="live" class="active"><span>▦</span> ภาพสด</button><button data-page="recordings"><span>◷</span> ดูย้อนหลัง</button><button data-page="cameras" class="admin-only"><span>◎</span> จัดการกล้อง</button><button data-page="users" class="admin-only"><span>♙</span> ผู้ใช้งาน</button><button data-page="system" class="admin-only"><span>≡</span> ระบบและกิจกรรม</button></nav><div class="sidebar-bottom"><span class="dot"></span> ผ่านเซิร์ฟเวอร์ในบ้าน<br><small>GimDVR · 1.2</small></div></aside>
<div class="main-wrap"><header><div><span class="eyebrow">GIMGIM / HOME</span><div class="header-label">พื้นที่ดูแลบ้านของคุณ</div></div><div class="header-right"><time id="clock"></time><button id="accountButton" class="quiet"></button><button id="logout" class="quiet">ออกจากระบบ</button></div></header><main id="main"></main></div></div>
<dialog id="editor"><form id="editorForm"></form></dialog><dialog id="controls"><div id="controlBody"></div></dialog><dialog id="player"><div class="dialog-title"><h2 id="playTitle">วิดีโอย้อนหลัง</h2><button data-close="player" class="quiet">✕</button></div><video id="playVideo" controls playsinline></video><div class="play-footer"><button id="previousClip">← ก่อนหน้า</button><label class="check"><input id="autoNext" type="checkbox" checked> เล่นไฟล์ถัดไปอัตโนมัติ</label><button id="nextClip">ถัดไป →</button></div><p id="playInfo" class="muted"></p></dialog><div id="toast" role="status" hidden></div></body></html>
